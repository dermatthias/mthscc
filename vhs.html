<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VHS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = c.width  = Math.min(window.innerWidth,  800);
const H = c.height = Math.min(window.innerHeight, 600);

/* ─── offscreen scene canvas ─────────────────────────────────────── */
const offC = document.createElement('canvas');
offC.width = W; offC.height = H;
const off = offC.getContext('2d');

/* ─── state ───────────────────────────────────────────────────────── */
let t = 0;
let glitchTimer  = 80;
let isGlitching  = false;
let glitchBands  = [];

/* ─── stars (generated once) ─────────────────────────────────────── */
const stars = Array.from({ length: 180 }, () => ({
  x:     Math.random() * W,
  y:     Math.random() * H * 0.56,
  r:     Math.random() * 1.4 + 0.3,
  phase: Math.random() * Math.PI * 2,
  spd:   Math.random() * 0.025 + 0.008,
}));

/* ══════════════════════════════════════════════════════════════════
   DRAW SCENE  (to offscreen canvas)
══════════════════════════════════════════════════════════════════ */
function drawScene() {

  /* sky */
  const sky = off.createLinearGradient(0, 0, 0, H * 0.62);
  sky.addColorStop(0,   '#020010');
  sky.addColorStop(0.7, '#12002e');
  sky.addColorStop(1,   '#340058');
  off.fillStyle = sky;
  off.fillRect(0, 0, W, H * 0.62);

  /* ground */
  const gnd = off.createLinearGradient(0, H * 0.62, 0, H);
  gnd.addColorStop(0, '#120020');
  gnd.addColorStop(1, '#020008');
  off.fillStyle = gnd;
  off.fillRect(0, H * 0.62, W, H * 0.38);

  /* stars */
  for (const s of stars) {
    s.phase += s.spd;
    const a = 0.25 + 0.75 * Math.abs(Math.sin(s.phase));
    off.beginPath();
    off.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    off.fillStyle = `rgba(220, 205, 255, ${a})`;
    off.fill();
  }

  /* sun glow */
  const sx = W / 2, sy = H * 0.62, sr = 72;
  const glow = off.createRadialGradient(sx, sy, sr * 0.4, sx, sy, sr * 3.2);
  glow.addColorStop(0,   'rgba(255, 80, 210, 0.38)');
  glow.addColorStop(0.5, 'rgba(255, 80, 210, 0.07)');
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  off.fillStyle = glow;
  off.fillRect(sx - sr * 3.5, sy - sr * 3.5, sr * 7, sr * 7);

  /* sun upper half */
  off.save();
  off.beginPath();
  off.arc(sx, sy, sr, -Math.PI, 0);
  off.closePath();
  const sunG = off.createLinearGradient(sx - sr, 0, sx + sr, 0);
  sunG.addColorStop(0,   '#ff55b8');
  sunG.addColorStop(0.5, '#ffb0e0');
  sunG.addColorStop(1,   '#ff55b8');
  off.fillStyle = sunG;
  off.fill();
  off.restore();

  /* sun lower half – horizontal stripe bands */
  for (let dy = 0; dy <= sr; dy += 6) {
    const hw = Math.sqrt(Math.max(0, sr * sr - dy * dy));
    const by = sy + dy;
    if (by >= H * 0.62) break;
    const a = 0.88 - (dy / sr) * 0.45;
    off.fillStyle = `rgba(255, 70, 185, ${a})`;
    off.fillRect(sx - hw, by, hw * 2, 4.5);
  }

  /* mountains */
  off.fillStyle = '#08001a';
  off.beginPath();
  off.moveTo(-5, H * 0.62);
  off.lineTo(W * 0.00, H * 0.50);
  off.lineTo(W * 0.10, H * 0.38);
  off.lineTo(W * 0.19, H * 0.47);
  off.lineTo(W * 0.29, H * 0.30);
  off.lineTo(W * 0.41, H * 0.51);
  off.lineTo(W * 0.50, H * 0.62);
  off.closePath();
  off.fill();

  off.beginPath();
  off.moveTo(W + 5, H * 0.62);
  off.lineTo(W * 1.00, H * 0.48);
  off.lineTo(W * 0.90, H * 0.36);
  off.lineTo(W * 0.81, H * 0.47);
  off.lineTo(W * 0.71, H * 0.28);
  off.lineTo(W * 0.59, H * 0.50);
  off.lineTo(W * 0.50, H * 0.62);
  off.closePath();
  off.fill();

  /* perspective grid */
  const hy = H * 0.62;
  const vp = W / 2;

  /* vertical lines */
  for (let i = -13; i <= 13; i++) {
    const endX = vp + i * 56;
    const a = Math.max(0, 0.55 - Math.abs(i) * 0.036);
    off.strokeStyle = `rgba(210, 0, 255, ${a})`;
    off.lineWidth = 1;
    off.beginPath();
    off.moveTo(vp, hy);
    off.lineTo(endX, H);
    off.stroke();
  }

  /* horizontal lines – animated scroll */
  const scroll = (t * 28) % 60;
  for (let i = 0; i < 14; i++) {
    const raw = i * 60 + scroll;
    const ratio = raw / 840;
    const ly = hy + raw * (H - hy) / 840;
    if (ly >= H) continue;
    const lx = vp - ratio * W * 0.76;
    const rx = vp + ratio * W * 0.76;
    const a = 0.12 + ratio * 0.6;
    off.strokeStyle = `rgba(210, 0, 255, ${a})`;
    off.lineWidth = 1;
    off.beginPath();
    off.moveTo(lx, ly);
    off.lineTo(rx, ly);
    off.stroke();
  }
}

/* ══════════════════════════════════════════════════════════════════
   APPLY VHS EFFECTS  (to main canvas)
══════════════════════════════════════════════════════════════════ */
function applyVHS() {
  ctx.clearRect(0, 0, W, H);

  const aberr = isGlitching ? 5 : 1.8;

  /* ── chromatic aberration: screen-blend ghosts ── */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(offC, 0, 0);                      // base

  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.16;
  ctx.drawImage(offC, -aberr * 1.4, 0);           // red ghost  (left)

  ctx.globalAlpha = 0.10;
  ctx.drawImage(offC,  aberr,        0);           // blue ghost (right)

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  /* ── glitch bands ── */
  if (isGlitching) {
    for (const b of glitchBands) {
      try {
        const px = ctx.getImageData(0, b.y, W, b.h);
        ctx.putImageData(px, b.dx, b.y);
        /* black out the exposed gap */
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        if (b.dx > 0) ctx.fillRect(0,        b.y, b.dx,  b.h);
        else           ctx.fillRect(W + b.dx, b.y, -b.dx, b.h);
      } catch (_) { /* cross-origin guard */ }
    }
    /* occasional color tear */
    if (Math.random() < 0.35) {
      const ty = Math.random() * H;
      const th = Math.random() * 2.5 + 0.5;
      const r  = Math.random() > 0.5 ? 255 : 0;
      const b2 = Math.random() > 0.5 ? 255 : 0;
      ctx.fillStyle = `rgba(${r},0,${b2},${Math.random() * 0.4 + 0.15})`;
      ctx.fillRect(0, ty, W, th);
    }
  }

  /* ── subtle horizontal tape wobble ── */
  /* applied as a very slight skew transform already; skipped for perf –
     scanlines give the same "texture" feel at lower cost */

  /* ── scanlines ── */
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);

  /* ── film grain / noise ── */
  const dots = isGlitching ? 550 : 180;
  for (let i = 0; i < dots; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const v = Math.floor(Math.random() * 160 + 95);
    const a = Math.random() * 0.11 + 0.02;
    ctx.fillStyle = `rgba(${v},${v},${v},${a})`;
    ctx.fillRect(x, y, 1, 1);
  }

  /* ── subtle dark color wash (VHS fading) ── */
  ctx.fillStyle = 'rgba(8, 0, 18, 0.07)';
  ctx.fillRect(0, 0, W, H);

  /* ── vignette ── */
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.22, W / 2, H / 2, H * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.58)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* ── head-switching artifact (bottom fringe) ── */
  if (Math.random() < 0.28) {
    const fy = H - Math.random() * 22 - 3;
    const fh = Math.random() * 4 + 1;
    ctx.fillStyle = `rgba(180, 0, 255, ${Math.random() * 0.22 + 0.04})`;
    ctx.fillRect(0, fy, W, fh);
  }
}

/* ══════════════════════════════════════════════════════════════════
   HUD OVERLAY
══════════════════════════════════════════════════════════════════ */
function drawHUD() {
  /* blinking REC dot + label */
  const blink = Math.floor(t * 1.1) % 2 === 0;
  if (blink) {
    ctx.beginPath();
    ctx.arc(20, 20, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#ff1500';
    ctx.fill();
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillText(' REC', 26, 25);
  }

  /* tape speed */
  ctx.font = '12px monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('SP', W - 85, 24);

  /* timestamp */
  const ts = Math.floor(t);
  const mm = String(Math.floor(ts / 60) % 60).padStart(2, '0');
  const ss = String(ts % 60).padStart(2, '0');
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.fillText(`${mm}:${ss}`, W - 60, H - 12);

  /* tape label */
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.font = '10px monospace';
  ctx.fillText('T-120 HG', W - 88, H - 26);
}

/* ══════════════════════════════════════════════════════════════════
   GLITCH STATE MACHINE
══════════════════════════════════════════════════════════════════ */
function tickGlitch() {
  glitchTimer--;
  if (glitchTimer > 0) return;

  isGlitching = Math.random() < 0.12;   /* 12% chance → glitch burst */
  if (isGlitching) {
    const n = Math.floor(Math.random() * 3) + 1;
    glitchBands = Array.from({ length: n }, () => ({
      y:  Math.floor(Math.random() * (H - 40)),
      h:  Math.floor(Math.random() * 22) + 3,
      dx: (Math.random() < 0.5 ? 1 : -1) * Math.floor(Math.random() * 38 + 8),
    }));
    glitchTimer = Math.floor(Math.random() * 7) + 2;   /* burst: 2–8 frames */
  } else {
    glitchTimer = Math.floor(Math.random() * 55) + 25; /* quiet: 25–80 frames */
  }
}

/* ══════════════════════════════════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════════════════════════════════ */
function loop() {
  t += 0.016;
  tickGlitch();
  drawScene();
  applyVHS();
  drawHUD();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
